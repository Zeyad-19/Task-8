<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>
    <button class="btn btn-primary" onclick="displayTasks()">Show Tasks</button>
    <button class="btn btn-danger" onclick="addTask()">Add Task</button>
    <button class="btn btn-dark" onclick="deleteTask()">Delete Task</button>
    <button class="btn btn-secondary" onclick="editTask()">Update Task</button>



    <script src="js/script.js"></script>
</body>

</html>
